name: 민생지원금 데이터 주간 갱신 (보조금24 API)

on:
  schedule:
    # 매주 월요일 KST 04:00 (= 일요일 19:00 UTC)
    - cron: "0 19 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 보조금24 API → 정규화 JSON (시도별 분할)
        env:
          GOV24_KEY: ${{ secrets.GOV24_KEY }}
          OUTDIR: minsaeng-data
        run: |
          python minsaeng-data/refresh-data.py

      - name: Git commit & push (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minsaeng-data/*.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
          else
            git commit -m "auto: 민생지원금 데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: 결과
        if: always()
        run: |
          echo "manifest:"; cat minsaeng-data/manifest.json || true
          echo "CDN: https://cdn.jsdelivr.net/gh/isthex/appintoss-assets@main/minsaeng-data/manifest.json"
